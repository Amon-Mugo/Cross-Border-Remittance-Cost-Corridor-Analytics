# Tests for int_corridor_costs_enriched. Relationship tests confirm every
# country/currency code produced by this model's joins actually resolves
# against the reference seeds — a broken match here would otherwise
# surface downstream as a silent null in a mart, much harder to trace.
#
# Tests for int_provider_cost_decomposed. not_null tests are warn-severity
# on the three cost-component columns since ~700 rows out of ~314.8k
# genuinely lack a usable lcu_amount/fx_margin in the source data — a
# known real gap, not a modeling error.

version: 2

models:
  - name: int_corridor_costs_enriched
    description: >
      stg_remittance_raw enriched with region/income (via corridor-derived
      country codes) and currency reference data. Join-only — does not
      change the staging grain (raw_id + cc_number).
    columns:
      - name: sending_country_code
        description: Left 3 characters of corridor (ISO3, using World Bank's XKX convention for Kosovo).
        tests:
          - not_null
          - relationships:
              to: ref('seed_region_income_reference')
              field: country_iso3

      - name: receiving_country_code
        description: Right 3 characters of corridor (ISO3, using World Bank's XKX convention for Kosovo).
        tests:
          - not_null
          - relationships:
              to: ref('seed_region_income_reference')
              field: country_iso3

      - name: lcu_code_resolved
        description: >
          Sending-side currency code, with CFA resolved to its real ISO
          4217 code (XOF for West African CFA zone countries, XAF for
          Central African CFA zone countries) based on sending country.
        tests:
          - relationships:
              to: ref('seed_currency_reference')
              field: currency_code

  - name: int_provider_cost_decomposed
    description: >
      int_corridor_costs_enriched decomposed into fee and FX margin cost
      components. Does not change grain (raw_id + cc_number) and does not
      reconcile against the reported total_cost_pct — that check belongs
      to int_transparency_flagged.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
           combination_of_columns:
            - raw_id
            - cc_number
    columns:
      - name: fee_cost_pct
        description: >
          Transaction fee as a percentage of the amount received
          (lcu_fee / lcu_amount * 100). Null wherever lcu_amount is
          0 or null — a real data gap, not a divide-by-zero error.
        tests:
          - not_null:
              config:
                severity: warn

      - name: fx_margin_pct
        description: >
          FX margin as reported in the source data, renamed for clarity
          alongside fee_cost_pct. No transformation applied.
        tests:
          - not_null:
              config:
                severity: warn

      - name: decomposed_cost_pct
        description: >
          fee_cost_pct + fx_margin_pct. Not reconciled here against the
          reported total_cost_pct — see int_transparency_flagged.
        tests:
          - not_null:
              config:
                severity: warn